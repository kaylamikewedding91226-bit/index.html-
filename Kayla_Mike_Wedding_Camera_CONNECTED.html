<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kayla & Mike | Wedding Camera</title>
<style>
:root{--burgundy:#651f31;--plum:#3e2339;--wheat:#ead8b7;--ink:#21191d}
*{box-sizing:border-box} body{margin:0;min-height:100vh;background:linear-gradient(145deg,#21191d,#3e2339);color:var(--wheat);font-family:Georgia,serif}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
.card{width:min(520px,100%);padding:30px 22px 26px;text-align:center;border:1px solid #ead8b766;border-radius:28px;background:#21191dcc;box-shadow:0 20px 60px #0008}
.orn{font-size:28px;letter-spacing:8px;opacity:.85}.names{font-size:38px;margin:10px 0 4px}.date{letter-spacing:3px;font-size:13px;text-transform:uppercase}.sub{font-style:italic;font-size:18px;margin:20px 0 24px}
video{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:20px;background:#111;display:none}
canvas{display:none}.preview{width:100%;border-radius:20px;display:none}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
button{border:0;border-radius:999px;padding:15px 22px;font-weight:bold;font-size:16px;background:var(--wheat);color:var(--ink);cursor:pointer}
button.alt{background:transparent;color:var(--wheat);border:1px solid #ead8b766}.status{min-height:28px;margin-top:15px;font-size:14px}.small{font-size:12px;opacity:.75;line-height:1.5;margin-top:18px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap"><main class="card">
<div class="orn">✦ ❦ ✦</div>
<div class="names">Kayla &amp; Mike</div>
<div class="date">September 12, 2026</div>
<div class="sub">Capture a little piece of our day.</div>

<video id="video" autoplay playsinline></video>
<img id="preview" class="preview" alt="Your wedding photo preview">
<canvas id="canvas"></canvas>

<div class="controls">
<button id="start">📸 Take a Photo</button>
<button id="snap" class="hidden">Capture</button>
<button id="again" class="alt hidden">Retake</button>
<button id="upload" class="hidden">Send to the Wedding Album</button>
</div>
<div id="status" class="status"></div>
<div class="small">No app or guest account needed. Camera permission is requested only when you choose to take a photo.</div>
</main></div>

<script>
const UPLOAD_URL = "https://script.google.com/macros/s/AKfycbx313lNeyM81JHlBTF4ZfQk5g0-Me2cB3XemZlbgiw-LmVY5COPTo9NewehmmqjMP4-/exec";
const video=document.getElementById('video'), canvas=document.getElementById('canvas'), preview=document.getElementById('preview');
const start=document.getElementById('start'), snap=document.getElementById('snap'), again=document.getElementById('again'), upload=document.getElementById('upload'), status=document.getElementById('status');
let stream=null, blob=null;

function msg(t){status.textContent=t}
start.onclick=async()=>{
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:1920}},audio:false});
    video.srcObject=stream; video.style.display="block"; start.classList.add("hidden"); snap.classList.remove("hidden"); msg("Camera ready — smile!");
  }catch(e){msg("Camera access was blocked. Please allow camera access and try again.");}
};
snap.onclick=()=>{
  canvas.width=video.videoWidth; canvas.height=video.videoHeight;
  canvas.getContext('2d').drawImage(video,0,0);
  canvas.toBlob(b=>{blob=b; preview.src=URL.createObjectURL(b); preview.style.display="block"; video.style.display="none"; snap.classList.add("hidden"); again.classList.remove("hidden"); upload.classList.remove("hidden"); msg("Looks great! Send it to the wedding album.");},"image/jpeg",.9);
  if(stream) stream.getTracks().forEach(t=>t.stop());
};
again.onclick=()=>{preview.style.display="none"; again.classList.add("hidden"); upload.classList.add("hidden"); start.classList.remove("hidden"); msg("")};
upload.onclick=async()=>{
  if(!blob){return}
  if(UPLOAD_URL.includes("PASTE_YOUR")){msg("The page is ready, but the owner still needs to connect the free Google Drive upload link.");return}
  upload.disabled=true; msg("Sending your photo…");
  const base64 = await new Promise(resolve=>{const r=new FileReader(); r.onload=()=>resolve(r.result.split(",")[1]); r.readAsDataURL(blob);});
  const payload=JSON.stringify({name:"wedding-"+Date.now()+".jpg",mimeType:"image/jpeg",base64});
  try{await fetch(UPLOAD_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:payload,mode:"no-cors"}); msg("❤️ Sent! Thank you for sharing a memory."); upload.classList.add("hidden"); again.classList.add("hidden");}
  catch(e){upload.disabled=false; msg("Upload failed. Please try again.");}
};
</script>
</body>
</html>
